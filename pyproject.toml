[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev6d"
version = "1.0.0"
description = "E-RAFT optical flow, 6D velocity Kalman filtering and RGB DOPE quaternion UKF"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "torch>=2.5",
  "bimvee>=1.0.15",
]
[project.scripts]
ev6d = "ev6d.cli:main"

[tool.setuptools.packages.find]
include = ["ev6d*"]
